
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | FarmSense</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main class="auth-card">
        <div class="logo">🌱 FarmSense</div>

        <h1>Create New Password</h1>
        <p>Enter a new password with at least 12 characters.</p>

        <form id="resetForm">
            <label for="password">New Password</label>
            <input type="password" id="password"
                   minlength="12" autocomplete="new-password" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   minlength="12" autocomplete="new-password" required>

            <button id="resetButton" type="submit" disabled>
                Update Password
            </button>
        </form>

        <p id="message" role="status" aria-live="polite">
            Verifying your reset link...
        </p>
        <p class="footer-text">
            <a href="index.html">Back to Login</a>
        </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseConfig.js"></script>

    <script>
        const message = document.getElementById("message");
        const resetButton = document.getElementById("resetButton");
        let recoveryVerified = false;

        farmSenseAuth.auth.onAuthStateChange((event) => {
            if (event === "PASSWORD_RECOVERY") {
                recoveryVerified = true;
                resetButton.disabled = false;
                message.textContent = "Reset link verified. Enter your new password.";
            }
        });

        document.getElementById("resetForm").addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                if (!recoveryVerified) {
                    message.textContent =
                        "Please open a valid password reset link from your email.";
                    return;
                }

                const password = document.getElementById("password").value;
                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                if (password.length < 12) {
                    message.textContent =
                        "Password must contain at least 12 characters.";
                    return;
                }

                if (password !== confirmPassword) {
                    message.textContent = "Passwords do not match.";
                    return;
                }

                resetButton.disabled = true;

                try {
                    const { error } = await farmSenseAuth.auth.updateUser({
                        password: password
                    });

                    if (error) throw error;

                    recoveryVerified = false;
                    message.textContent =
                        "Password updated successfully. You can now log in.";

                    await farmSenseAuth.auth.signOut();
                } catch (error) {
                    message.textContent = error.message;
                    resetButton.disabled = false;
                }
            }
        );
    </script>
</body>
</html>
