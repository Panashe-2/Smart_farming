
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | FarmSense</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main class="auth-card">
        <div class="logo">🌱 FarmSense</div>

        <h1>Forgot Password?</h1>
        <p>Enter your email address to receive a password reset link.</p>

        <form id="forgotForm">
            <label for="email">Email Address</label>
            <input type="email" id="email" required
                   autocomplete="email"
                   placeholder="Enter your registered email">

            <button type="submit">Send Reset Link</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
        <p class="footer-text">
            <a href="index.html">Back to Login</a>
        </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseConfig.js"></script>

    <script>
        document.getElementById("forgotForm").addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                const email = document.getElementById("email").value.trim();
                const message = document.getElementById("message");

                try {
                    const { error } =
                        await farmSenseAuth.auth.resetPasswordForEmail(
                            email,
                            {
                                redirectTo: new URL(
                                    "reset-password.html",
                                    window.location.href
                                ).href
                            }
                        );

                    if (error) throw error;

                    message.textContent =
                        "If this account exists, a password reset email will be sent.";
                } catch (error) {
                    message.textContent = error.message;
                }
            }
        );
    </script>
</body>
</html>
